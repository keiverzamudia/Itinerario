{% extends "base.html" %}

{% block title %}Crear Recurso{% endblock %}

{% block content %}
<div class="container-fluid px-4 py-4">
    <div class="card border-0 shadow-sm" style="max-width: 700px; margin: 0 auto;">
        <div class="card-header bg-dark text-white py-3">
            <h5 class="mb-0 fw-bold"><i class="fas fa-plus-circle me-2"></i>Crear Nuevo Recurso</h5>
        </div>
        <div class="card-body p-4">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="mb-3">
                    <label class="form-label fw-bold small text-dark">Nombre del recurso <span class="text-danger">*</span></label>
                    <input type="text" name="nombre" class="form-control" required placeholder="Ej. Proyector Epson EB-2055">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold small text-dark">Descripción</label>
                    <textarea name="descripcion" class="form-control" rows="3" placeholder="Descripción opcional"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold small text-dark">Tipo <span class="text-danger">*</span></label>
                    <select name="tipo_id" class="form-select" required>
                        <option value="" disabled selected>Seleccione un tipo</option>
                        {% for tipo in tipos %}
                        <option value="{{ tipo.id }}">{{ tipo.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold small text-dark">Fecha de compra</label>
                        <input type="date" name="fecha_compra" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold small text-dark">Costo</label>
                        <input type="number" step="0.01" name="costo" class="form-control" placeholder="0.00">
                    </div>
                </div>
                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="{{ url_for('inventario.dashboard') }}" class="btn btn-light px-4">Cancelar</a>
                    <button type="submit" class="btn btn-success px-4 shadow-sm fw-bold">Guardar Recurso</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% block extra_js %}
<script>
document.querySelector('form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const nombre = this.querySelector('[name="nombre"]').value.trim();
    if (!nombre) { this.submit(); return; }
    const result = await Swal.fire({
        title: '¿Crear recurso?',
        text: `Crear recurso "${nombre}"`,
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#28a745',
        confirmButtonText: 'Crear',
        cancelButtonText: 'Cancelar'
    });
    if (result.isConfirmed) HTMLFormElement.prototype.submit.call(this);
});
</script>
{% endblock %}
{% endblock %}
