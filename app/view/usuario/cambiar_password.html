{% include 'components/head.html' %}

<div class="container-fluid px-4 py-4">
    <div class="d-flex align-items-center gap-3 mb-4">
        <div>
            <h1 class="h3 fw-bold mb-1">
                <i class="fas fa-key me-2 text-warning"></i>Cambiar Contrase&ntilde;a
            </h1>
            <p class="text-muted mb-0">Actualiza tu contrase&ntilde;a de acceso al sistema.</p>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-dark text-white py-3">
                    <h4 class="mb-0"><i class="fas fa-lock me-2"></i>Cambiar Contrase&ntilde;a</h4>
                </div>
                <div class="card-body p-4">
                    <form novalidate method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label for="password_actual" class="form-label fw-semibold">Contrase&ntilde;a Actual</label>
                            <div class="password-toggle">
                                <input type="password" class="form-control" id="password_actual" name="password_actual" required maxlength="30">
                                <i class="fas fa-eye password-eye" onclick="togglePass(this)"></i>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password_nueva" class="form-label fw-semibold">Nueva Contrase&ntilde;a</label>
                            <div class="password-toggle">
                                <input type="password" class="form-control" id="password_nueva" name="password_nueva" required minlength="8" maxlength="30">
                                <i class="fas fa-eye password-eye" onclick="togglePass(this)"></i>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="confirmar_password" class="form-label fw-semibold">Confirmar Contrase&ntilde;a</label>
                            <div class="password-toggle">
                                <input type="password" class="form-control" id="confirmar_password" name="confirmar_password" required maxlength="30">
                                <i class="fas fa-eye password-eye" onclick="togglePass(this)"></i>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                            <a href="{{ url_for('usuario.dashboard') }}" class="btn btn-secondary px-4">
                                Cancelar
                            </a>
                            <button type="submit" class="btn btn-warning px-4 fw-bold">
                                <i class="fas fa-save me-2"></i>Cambiar Contrase&ntilde;a
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function togglePass(el) {
  var inp = el.parentElement.querySelector('input');
  if (!inp) return;
  var t = inp.type;
  inp.type = t === 'password' ? 'text' : 'password';
  el.className = t === 'password' ? 'fas fa-eye-slash password-eye' : 'fas fa-eye password-eye';
}
</script>
<script type="module" src="{{ url_for('static', filename='js/GestionUsuario.js') }}"></script>
