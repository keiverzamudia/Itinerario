{% include 'components/head.html' %}

<div class="container-fluid px-4 py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h4 class="fw-bold text-dark mb-1">
        <i class="fas fa-eye me-2 text-primary"></i>Seguimiento de Tareas
      </h4>
      <p class="text-muted small mb-0">Todas las tareas asignadas a todos los usuarios</p>
    </div>
    <a href="{{ url_for('gestion_tarea.dashboard') }}" class="btn btn-outline-secondary py-2">
      <i class="fas fa-arrow-left me-1"></i> Volver
    </a>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-header bg-white border-bottom py-3 px-4">
      <h6 class="fw-bold mb-0"><i class="fas fa-list me-2 text-primary"></i> Asignaciones</h6>
    </div>
    <div class="card-body p-0">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="table-responsive">
        <table class="table table-striped table-hover table-bordered align-middle mb-0 datatable" id="tablaSeguimiento">
          <thead class="table-light">
            <tr>
              <th class="text-center">Usuario</th>
              <th class="text-center">Tarea</th>
              <th class="text-center">Instrucción</th>
              <th class="text-center">Estado</th>
              <th class="text-center">Fecha</th>
              <th class="no-order text-center">Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script type="module" src="{{ url_for('static', filename='js/GestionTareaSeguimiento.js') }}"></script>
{% include 'components/footer.html' %}
