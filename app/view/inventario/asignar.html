{% include 'components/head.html' %}

<div class="container-fluid px-4 py-4">
    <div class="card border-0 shadow-sm" style="max-width: 600px; margin: 0 auto;">
        <div class="card-header bg-dark text-white border-0 py-3 px-4">
            <h5 class="mb-0 fw-bold"><i class="fas fa-handshake me-2"></i>Asignar Recurso: {{ recurso.nombre }}</h5>
        </div>
        <div class="card-body p-4">
            <form novalidate method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="mb-3">
                    <label class="form-label fw-bold small text-dark">Usuario <span class="text-danger">*</span></label>
                    <select name="usuario_id" class="form-select" required>
                        <option value="" disabled selected>Seleccione un usuario</option>
                        {% for u in usuarios %}
                        <option value="{{ u.id }}">{{ u.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold small text-dark">Fecha de devoluci&oacute;n esperada</label>
                    <input type="date" name="fecha_devolucion_esperada" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold small text-dark">Notas</label>
                    <textarea name="notas" class="form-control" rows="2" maxlength="500" placeholder="Motivo de la asignaci&oacute;n"></textarea>
                </div>
                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="{{ url_for('inventario.ver', id=recurso.id) }}" class="btn btn-secondary px-4">Cancelar</a>
                    <button type="submit" class="btn btn-primary shadow-sm fw-bold px-4">Asignar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script type="module" src="{{ url_for('static', filename='js/GestionInventario.js') }}"></script>
{% include 'components/footer.html' %}
