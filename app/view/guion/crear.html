{% include 'components/head.html' %}

<div class="container-fluid px-4 py-4">
    <div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white border-bottom py-3 px-4">
                <h5 class="fw-bold mb-0"><i class="fas fa-plus-circle me-2 text-primary"></i>Crear Nuevo Guión</h5>
            </div>
            <div class="card-body">
                <form novalidate method="POST" id="guionForm">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="nombre" class="form-label fw-bold">Nombre del Guión</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Nombre del guion..." required minlength="3" maxlength="50">
                        <div class="invalid-feedback"></div>
                        <small class="text-muted">Se asignará automáticamente la fecha de hoy</small>
                    </div>

                    <div class="mb-3">
                        <label for="tiempo_inning" class="form-label fw-bold">Tiempo por Inning</label>
                        <div class="input-group">
                            <span class="input-group-text">⏱️</span>
                            <input type="text" class="form-control" id="tiempo_inning" name="tiempo_inning" placeholder="min,seg" maxlength="5" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9,]/g,'')">
                            <div class="invalid-feedback"></div>
                        </div>
                        <small class="text-muted">Tiempo que durará cada evento tipo Game (ej: 3,30). Se autocompletará al agregar elementos.</small>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Crear Guión</button>
                        <a href="{{ url_for('guion.dashboard') }}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    </div>
</div>

<script type="module" src="{{ url_for('static', filename='js/GestionGuion.js') }}"></script>

{% include 'components/footer.html' %}
