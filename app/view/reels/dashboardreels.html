{% include 'components/head.html' %}

<div class="container-fluid px-4 py-4">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
            <h1 class="h3 fw-bold mb-1">
                <i class="fas fa-video me-2 text-primary"></i>Gestión de Reels
            </h1>
            <p class="text-muted mb-0">Administra los reels y sus videos promocionales</p>
        </div>
        <a href="{{ url_for('reels.crear') }}" class="btn btn-primary px-4 py-2 shadow-sm fw-bold">
            <i class="fas fa-plus me-2"></i> Nuevo Reel
        </a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-bottom py-3 px-4">
            <h5 class="fw-bold mb-0"><i class="fas fa-list me-2 text-primary"></i>Listado de Reels</h5>
        </div>
        <div class="card-body p-0">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="table-responsive">
                <table class="table table-striped table-hover table-bordered align-middle mb-0 datatable" id="tablaReels">
                    <thead class="table-light">
                        <tr>
                            <th class="text-center">Nombre</th>
                            <th class="text-center">Duración</th>
                            <th class="no-order text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="module" src="{{ url_for('static', filename='js/GestionReel.js') }}"></script>
{% include 'components/footer.html' %}
